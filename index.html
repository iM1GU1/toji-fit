<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Plan Toji</title>
<meta name="theme-color" content="#131210">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <h1 id="gate-title">Plan Toji</h1>

    <div class="gate-tabs" id="gate-tabs">
      <button data-mode="login" class="active">Entrar</button>
      <button data-mode="signup">Crear cuenta</button>
    </div>

    <input type="email" id="gate-email" autocomplete="email" placeholder="Email" inputmode="email">
    <input type="password" id="gate-password" autocomplete="current-password" placeholder="Contraseña">

    <p class="gate-err" id="gate-err"></p>
    <p class="gate-ok" id="gate-ok"></p>

    <button id="gate-btn" class="btn primary">Entrar</button>
    <button id="gate-forgot" class="gate-forgot">¿Has olvidado tu contraseña?</button>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <div class="brand">Plan Toji</div>
    <div class="row" style="gap:8px;">
      <div class="xp-pill" id="xp-pill">
        <span class="lvl">Nv <span id="xp-level">1</span></span>
        <div class="xp-bar-mini"><div class="xp-bar-fill" id="xp-bar-fill" style="width:0%"></div></div>
      </div>
      <div class="streak-pill" id="streak-pill">
        <img class="flame" src="icons/flame.svg" alt="">
        <span class="n" id="streak-n">0</span>
      </div>
      <button class="icon-btn" id="btn-settings" aria-label="Ajustes">⚙️</button>
    </div>
  </header>

  <main id="main">
    <section class="view" id="view-rutina"></section>
    <section class="view" id="view-entrenar"></section>
    <section class="view" id="view-comer"></section>
    <section class="view" id="view-guias"></section>
    <section class="view" id="view-amigos"></section>
    <section class="view" id="view-yo"></section>
  </main>

  <nav class="bottom" id="bottom-nav">
    <div class="nav-indicator" id="nav-indicator"></div>
    <button data-view="rutina" class="active">
      <span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="9.5" x2="21" y2="9.5"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg></span>Rutina
    </button>
    <button data-view="entrenar">
      <span class="ic"><svg viewBox="0 0 24 24"><line x1="6.5" y1="12" x2="17.5" y2="12"/><rect x="1.5" y="9" width="3" height="6" rx="1"/><rect x="19.5" y="9" width="3" height="6" rx="1"/><rect x="4.5" y="7" width="2.5" height="10" rx="1"/><rect x="17" y="7" width="2.5" height="10" rx="1"/></svg></span>Entrenar
    </button>
    <button data-view="comer">
      <span class="ic"><svg viewBox="0 0 24 24"><line x1="5" y1="2" x2="5" y2="9"/><line x1="7" y1="2" x2="7" y2="9"/><line x1="9" y1="2" x2="9" y2="9"/><path d="M5 9c0 1.6 1 2.2 2 2.2s2-.6 2-2.2"/><line x1="7" y1="11.2" x2="7" y2="22"/><path d="M17.5 2c2 2.2 2 6.3 0 9c-.8.9-1.7 1-1.7 1v10"/></svg></span>Comer
    </button>
    <button data-view="guias">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 6.5c-2-1.6-5-2.1-8.5-1v13c3.5-1.1 6.5-.6 8.5 1c2-1.6 5-2.1 8.5-1v-13c-3.5-1.1-6.5-.6-8.5 1z"/><line x1="12" y1="6.5" x2="12" y2="19.5"/></svg></span>Guías
    </button>
    <button data-view="amigos">
      <span class="ic"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.2 2.5-5.3 6-5.3s6 2.1 6 5.3"/><circle cx="17.5" cy="9" r="2.3"/><path d="M15.8 12.1c2.6.4 4.2 2.2 4.2 5.4"/></svg></span>Amigos
    </button>
    <button data-view="yo">
      <span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3.2"/><path d="M6 18.5c1-2.8 3.2-4.3 6-4.3s5 1.5 6 4.3"/></svg></span>Yo
    </button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js?v=7"></script>
<script src="js/store.js?v=7"></script>
<script src="js/engine.js?v=7"></script>
<script src="js/auth.js?v=7"></script>
<script src="js/view-rutina.js?v=7"></script>
<script src="js/view-entrenar.js?v=7"></script>
<script src="js/view-comer.js?v=7"></script>
<script src="js/view-guias.js?v=7"></script>
<script src="js/view-amigos.js?v=7"></script>
<script src="js/view-yo.js?v=7"></script>
<script src="js/main.js?v=7"></script>
</body>
</html>
