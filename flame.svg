[
  {"id":"press_banca_mancuernas","nombre":"Press banca con mancuernas","en":"Dumbbell Bench Press","grupo":"pecho","musculos_sec":["hombro","triceps"],"equipo":["mancuernas","banco"],"nivel":"intermedio","tags_toji":["v_taper","fuerza_base"],"coef":0.40,"img":"Dumbbell_Bench_Press/0.jpg","instrucciones":["Túmbate en el banco con una mancuerna en cada mano, apoyadas sobre los muslos.","Usa las rodillas para ayudarte a llevarlas a la altura del pecho mientras te recuestas.","Extiende los brazos hacia arriba con las palmas mirando adelante — esa es la posición inicial.","Baja las mancuernas de forma controlada hasta que los codos queden un poco por debajo del torso.","Empuja hacia arriba hasta extender los brazos casi del todo, sin bloquear el codo con fuerza."],"errores_comunes":["Bajar demasiado rápido y perder el control en el pecho.","Arquear demasiado la zona lumbar — mantén los pies firmes en el suelo y el core activado."]},
  {"id":"press_banca_barra","nombre":"Press de banca con barra","en":"Barbell Bench Press","grupo":"pecho","musculos_sec":["hombro","triceps"],"equipo":["barra","banco"],"nivel":"intermedio","tags_toji":["v_taper","fuerza_base","prioridad"],"coef":0.65,"img":"Barbell_Bench_Press/0.jpg","instrucciones":["Túmbate en el banco, ojos justo debajo de la barra, agarre algo más ancho que los hombros.","Saca la barra del soporte y bájala controlada hasta rozar la parte baja del pecho.","Empuja hacia arriba en línea recta hasta extender los brazos, sin bloquear el codo con violencia."],"errores_comunes":["Rebotar la barra en el pecho para ganar impulso.","Despegar los glúteos del banco — mantén 3 puntos de apoyo firmes."]},
  {"id":"press_inclinado_mancuernas","nombre":"Press inclinado con mancuernas","en":"Incline Dumbbell Press","grupo":"pecho","musculos_sec":["hombro","triceps"],"equipo":["mancuernas","banco"],"nivel":"intermedio","tags_toji":["v_taper"],"coef":0.32,"img":"Incline_Dumbbell_Press/0.jpg","instrucciones":["Inclina el respaldo del banco entre 30 y 45 grados.","Siéntate con una mancuerna en cada mano apoyada sobre los muslos y recuéstate llevándolas al pecho.","Empuja las mancuernas hacia arriba y ligeramente hacia dentro hasta casi juntarlas arriba.","Baja controlado hasta sentir un buen estiramiento en la parte alta del pecho."],"errores_comunes":["Inclinar el banco demasiado (más de 45°) convierte el ejercicio en press de hombro.","Rebotar las mancuernas abajo en vez de controlar el descenso."]},
  {"id":"press_inclinado_barra","nombre":"Press inclinado con barra","en":"Incline Barbell Press","grupo":"pecho","musculos_sec":["hombro","triceps"],"equipo":["barra","banco"],"nivel":"intermedio","tags_toji":["v_taper"],"coef":0.52,"img":"","instrucciones":["Banco inclinado 30-45°, agarre algo más ancho que los hombros.","Baja la barra controlada hasta la parte alta del pecho, cerca de la clavícula.","Empuja hacia arriba hasta extender los brazos casi del todo."],"errores_comunes":["Inclinar demasiado el banco — pasa a trabajar más hombro que pecho.","Bajar la barra hacia el cuello en vez de hacia el pecho alto."]},
  {"id":"press_pecho_maquina","nombre":"Press de pecho en máquina","en":"Machine Chest Press","grupo":"pecho","musculos_sec":["hombro","triceps"],"equipo":["maquina"],"nivel":"principiante","tags_toji":["v_taper"],"coef":0.45,"img":"","instrucciones":["Ajusta el asiento para que las asas queden a la altura del pecho.","Empuja hacia adelante hasta extender los brazos, sin bloquear el codo con fuerza.","Vuelve controlado hasta sentir el estiramiento en el pecho."],"errores_comunes":["Elegir un peso tan alto que pierdes el control en la vuelta.","Despegar la espalda del respaldo para ayudarte con el impulso."]},
  {"id":"flexiones","nombre":"Flexiones","en":"Push-Up","grupo":"pecho","musculos_sec":["hombro","triceps","core"],"equipo":["peso_corporal"],"nivel":"principiante","tags_toji":["v_taper","abdomen_visible"],"coef":0,"img":"Pushups/0.jpg","instrucciones":["Manos en el suelo un poco más anchas que los hombros, cuerpo en línea recta de cabeza a talones.","Baja el pecho hacia el suelo manteniendo los codos a unos 45° del cuerpo.","Sube empujando el suelo hasta extender los brazos, sin perder la línea recta del cuerpo."],"errores_comunes":["Dejar caer la cadera — aprieta glúteo y abdomen durante todo el movimiento.","Codos totalmente abiertos a 90°, sobrecargan el hombro."]},
  {"id":"flexiones_deficit","nombre":"Flexiones con déficit","en":"Deficit Push-Up","grupo":"pecho","musculos_sec":["hombro","triceps","core"],"equipo":["peso_corporal"],"nivel":"intermedio","tags_toji":["v_taper"],"coef":0,"img":"","instrucciones":["Coloca las manos sobre dos superficies elevadas (discos o step), separación algo mayor que los hombros.","Baja el pecho por debajo del nivel de las manos, ganando más rango que en la flexión normal.","Sube controlado hasta extender los brazos."],"errores_comunes":["Bajar tan rápido que pierdes tensión — controla siempre el descenso."]},
  {"id":"fondos_paralelas","nombre":"Fondos en paralelas","en":"Parallel Bar Dips","grupo":"pecho","musculos_sec":["triceps","hombro"],"equipo":["paralelas"],"nivel":"intermedio","tags_toji":["v_taper","prioridad"],"coef":0,"img":"","instrucciones":["Sujétate en las paralelas con los brazos extendidos, torso ligeramente inclinado adelante.","Baja doblando los codos hasta 90° aproximadamente.","Empuja hacia arriba hasta extender los brazos del todo."],"errores_comunes":["Bajar demasiado y forzar el hombro — para si sientes pinzamiento.","Dejar caer el cuerpo en vertical convierte el ejercicio en más tríceps que pecho."]},
  {"id":"aperturas_mancuernas","nombre":"Aperturas con mancuernas","en":"Dumbbell Fly","grupo":"pecho","musculos_sec":[],"equipo":["mancuernas","banco"],"nivel":"intermedio","tags_toji":["v_taper"],"coef":0.16,"img":"","instrucciones":["Túmbate en el banco con una mancuerna en cada mano, brazos extendidos sobre el pecho y codos ligeramente flexionados.","Abre los brazos en arco hacia los lados, bajando hasta sentir el estiramiento en el pecho.","Vuelve a juntar las mancuernas arriba con el mismo arco, apretando el pecho."],"errores_comunes":["Flexionar y extender el codo como si fuera un press — el codo se mantiene fijo, solo el hombro se mueve.","Bajar demasiado y forzar el hombro."]},
  {"id":"aperturas_polea","nombre":"Aperturas en polea (cruce de poleas)","en":"Cable Crossover","grupo":"pecho","musculos_sec":[],"equipo":["polea"],"nivel":"intermedio","tags_toji":["v_taper"],"coef":0.12,"img":"","instrucciones":["Coloca las poleas altas, un agarre en cada mano, un paso adelante del punto medio.","Junta las manos delante del pecho en un arco, apretando fuerte al final.","Vuelve controlado hasta sentir el estiramiento, sin perder la ligera flexión de codo."],"errores_comunes":["Usar los brazos como si fuera un press en vez de un arco.","Colocarte demasiado cerca de las poleas, perdiendo rango."]},

  {"id":"press_militar_mancuernas","nombre":"Press militar sentado con mancuernas","en":"Seated Dumbbell Shoulder Press","grupo":"hombro","musculos_sec":["triceps"],"equipo":["mancuernas","banco"],"nivel":"intermedio","tags_toji":["hombro_ancho","v_taper"],"coef":0.24,"img":"Seated_Dumbbell_Press/0.jpg","instrucciones":["Siéntate con el respaldo recto, una mancuerna en cada mano a la altura de los hombros, palmas hacia adelante.","Empuja las mancuernas hacia arriba hasta casi juntarlas sobre la cabeza, sin bloquear el codo con fuerza.","Baja controlado hasta que los codos vuelvan a la altura de los hombros."],"errores_comunes":["Arquear la espalda para ayudar el empuje — usa un respaldo o aprieta el core.","No bajar lo suficiente, perdiendo rango de movimiento."]},
  {"id":"press_militar_pie","nombre":"Press militar de pie con mancuernas","en":"Standing Dumbbell Press","grupo":"hombro","musculos_sec":["triceps","core"],"equipo":["mancuernas"],"nivel":"intermedio","tags_toji":["hombro_ancho"],"coef":0.20,"img":"","instrucciones":["De pie, pies a la anchura de cadera, mancuernas a la altura de los hombros.","Aprieta glúteo y abdomen para no arquear la espalda.","Empuja las mancuernas hacia arriba hasta extender casi del todo los brazos, baja controlado."],"errores_comunes":["Usar impulso de piernas (eso es un 'push press', no press estricto).","Arquear la zona lumbar en el bloqueo superior."]},
  {"id":"press_militar_barra","nombre":"Press militar con barra","en":"Barbell Overhead Press","grupo":"hombro","musculos_sec":["triceps","core"],"equipo":["barra"],"nivel":"intermedio","tags_toji":["hombro_ancho","prioridad"],"coef":0.45,"img":"","instrucciones":["De pie, barra a la altura de la clavícula, agarre algo más ancho que los hombros.","Aprieta glúteo y abdomen, empuja la barra hacia arriba en línea recta hasta extender los brazos.","Baja controlado hasta la posición inicial."],"errores_comunes":["Arquear demasiado la zona lumbar para compensar.","Empujar la barra hacia adelante en vez de en línea recta sobre la cabeza."]},
  {"id":"press_hombro_maquina","nombre":"Press de hombro en máquina","en":"Machine Shoulder Press","grupo":"hombro","musculos_sec":["triceps"],"equipo":["maquina"],"nivel":"principiante","tags_toji":["hombro_ancho"],"coef":0.35,"img":"","instrucciones":["Ajusta el asiento para que las asas empiecen a la altura de los hombros.","Empuja hacia arriba hasta casi extender los brazos.","Baja controlado hasta la posición inicial."],"errores_comunes":["Despegar la espalda del respaldo para generar impulso."]},
  {"id":"elevaciones_laterales","nombre":"Elevaciones laterales","en":"Lateral Raise","grupo":"hombro","musculos_sec":[],"equipo":["mancuernas"],"nivel":"principiante","tags_toji":["hombro_ancho","v_taper","prioridad"],"coef":0.06,"img":"Side_Lateral_Raise/0.jpg","instrucciones":["De pie, una mancuerna en cada mano a los lados del cuerpo, ligera flexión de codo.","Eleva los brazos hacia los lados hasta la altura de los hombros, como si fueras a formar una 'T'.","Baja controlado sin dejar caer el peso de golpe."],"errores_comunes":["Balancear el cuerpo para generar impulso — reduce el peso si necesitas balancearte.","Subir por encima de la altura del hombro sobrecarga la articulación sin más beneficio."]},
  {"id":"elevaciones_laterales_polea","nombre":"Elevaciones laterales en polea","en":"Cable Lateral Raise","grupo":"hombro","musculos_sec":[],"equipo":["polea"],"nivel":"intermedio","tags_toji":["hombro_ancho","v_taper"],"coef":0.08,"img":"","instrucciones":["Polea baja a un lado, agárrala con la mano contraria por delante del cuerpo.","Eleva el brazo hacia el lado hasta la altura del hombro, manteniendo tensión constante.","Baja controlado sin que la polea toque la pila de pesos."],"errores_comunes":["Girar el torso para ayudarte — mantén los hombros fijos y cuadrados."]},
  {"id":"elevaciones_frontales","nombre":"Elevaciones frontales","en":"Front Raise","grupo":"hombro","musculos_sec":[],"equipo":["mancuernas"],"nivel":"principiante","tags_toji":["hombro_ancho"],"coef":0.06,"img":"","instrucciones":["De pie, mancuernas frente a los muslos, palmas hacia el cuerpo.","Eleva un brazo (o los dos) hacia adelante hasta la altura del hombro.","Baja controlado y repite alternando o a la vez."],"errores_comunes":["Usar impulso de cadera para levantar el peso.","Subir más arriba del hombro innecesariamente."]},
  {"id":"pajaros_reverse_fly","nombre":"Pájaros (deltoide posterior)","en":"Bent Over Rear Delt Raise","grupo":"hombro","musculos_sec":["espalda"],"equipo":["mancuernas"],"nivel":"intermedio","tags_toji":["hombro_ancho","postura"],"coef":0.05,"img":"","instrucciones":["Inclina el torso hacia adelante casi 90° con las rodillas ligeramente flexionadas, mancuernas colgando.","Con los codos ligeramente flexionados, abre los brazos hacia los lados apretando los omóplatos.","Baja controlado hasta la posición inicial."],"errores_comunes":["Enderezar la espalda durante el movimiento — mantén el torso inclinado fijo.","Usar demasiado peso y convertirlo en un tirón brusco."]},
  {"id":"pajaros_polea","nombre":"Pájaros en polea cruzada","en":"Cable Reverse Fly","grupo":"hombro","musculos_sec":["espalda"],"equipo":["polea"],"nivel":"intermedio","tags_toji":["hombro_ancho","postura"],"coef":0.08,"img":"","instrucciones":["Cruza las poleas altas y agarra cada una con la mano contraria.","Con los brazos casi extendidos, abre hacia los lados apretando los omóplatos.","Vuelve controlado a la posición inicial."],"errores_comunes":["Flexionar demasiado el codo — pierde tensión en el deltoide posterior."]},
  {"id":"face_pull_banda","nombre":"Face pull con banda","en":"Band Face Pull","grupo":"hombro","musculos_sec":["espalda"],"equipo":["banda"],"nivel":"principiante","tags_toji":["hombro_ancho","postura"],"coef":0,"img":"","instrucciones":["Ancla la banda a la altura de la cara (un marco de puerta funciona bien).","Tira de la banda hacia tu cara separando las manos, codos altos, como si abrieras un arco y flecha.","Aprieta los omóplatos al final del recorrido y vuelve controlado."],"errores_comunes":["Tirar con los codos bajos — conviértelo en remo, no en face pull.","Usar el peso del cuerpo hacia atrás en vez de la fuerza de la espalda."]},
  {"id":"face_pull_polea","nombre":"Face pull en polea","en":"Cable Face Pull","grupo":"hombro","musculos_sec":["espalda"],"equipo":["polea"],"nivel":"principiante","tags_toji":["hombro_ancho","postura"],"coef":0.12,"img":"","instrucciones":["Polea a la altura de la cara con cuerda, agarre con las palmas hacia dentro.","Tira hacia tu cara separando las manos y llevando los codos altos.","Aprieta los omóplatos y vuelve controlado."],"errores_comunes":["Tirar con los codos bajos y convertirlo en remo."]},

  {"id":"fondos_banco","nombre":"Fondos en banco","en":"Bench Dip","grupo":"triceps","musculos_sec":["hombro","pecho"],"equipo":["banco"],"nivel":"principiante","tags_toji":["brazo_definido"],"coef":0,"img":"","instrucciones":["Siéntate en el borde del banco, manos junto a las caderas, dedos hacia adelante.","Adelanta las caderas fuera del banco, piernas extendidas o flexionadas según dificultad.","Baja doblando los codos hasta unos 90°, y empuja de vuelta arriba."],"errores_comunes":["Bajar demasiado y forzar el hombro — para si sientes pinzamiento.","Alejar demasiado los pies aumenta mucho la dificultad; acércalos si no llegas a las repeticiones."]},
  {"id":"extension_triceps_una_mano","nombre":"Extensión de tríceps a una mano","en":"Single-Arm Overhead Triceps Extension","grupo":"triceps","musculos_sec":[],"equipo":["mancuernas"],"nivel":"intermedio","tags_toji":["brazo_definido"],"coef":0.10,"img":"","instrucciones":["De pie o sentado, sujeta una mancuerna con una mano por encima de la cabeza, brazo extendido.","Baja la mancuerna detrás de la cabeza flexionando solo el codo, el brazo superior se mantiene fijo.","Extiende de vuelta arriba apretando el tríceps."],"errores_comunes":["Mover el codo hacia adelante y atrás — debe quedarse apuntando al techo.","Usar demasiado peso y arquear la espalda."]},
  {"id":"press_frances","nombre":"Press francés (extensión tumbado)","en":"Lying Triceps Extension","grupo":"triceps","musculos_sec":[],"equipo":["mancuernas","banco"],"nivel":"intermedio","tags_toji":["brazo_definido"],"coef":0.12,"img":"","instrucciones":["Tumbado en el banco, mancuernas extendidas sobre el pecho, palmas encaradas.","Baja las mancuernas hacia la frente flexionando solo el codo, codos fijos apuntando al techo.","Extiende de vuelta arriba sin mover el brazo superior."],"errores_comunes":["Abrir los codos hacia los lados — se convierte en otro ejercicio.","Bajar la mancuerna hacia la cara con poco control."]},
  {"id":"press_frances_polea","nombre":"Press francés en polea con cuerda","en":"Cable Overhead Triceps Extension","grupo":"triceps","musculos_sec":[],"equipo":["polea"],"nivel":"intermedio","tags_toji":["brazo_definido"],"coef":0.16,"img":"","instrucciones":["De espaldas a la polea baja, cuerda sujeta con ambas manos por encima de la cabeza.","Extiende los brazos hacia adelante y arriba, codos fijos.","Vuelve controlado sin perder tensión."],"errores_comunes":["Mover los codos hacia adelante — deben quedarse fijos junto a la cabeza."]},
  {"id":"extension_triceps_polea","nombre":"Extensión de tríceps en polea (jalón)","en":"Cable Triceps Pushdown","grupo":"triceps","musculos_sec":[],"equipo":["polea"],"nivel":"principiante","tags_toji":["brazo_definido","prioridad"],"coef":0.20,"img":"","instrucciones":["De pie frente a la polea alta, agarre de barra o cuerda, codos pegados al cuerpo.","Empuja hacia abajo hasta extender los brazos, apretando el tríceps.","Sube controlado sin despegar los codos del costado."],"errores_comunes":["Despegar los codos del cuerpo — pierde tensión y mete hombro.","Usar el peso del cuerpo hacia adelante en vez del tríceps."]},
  {"id":"patada_triceps","nombre":"Patada de tríceps","en":"Triceps Kickback","grupo":"triceps","musculos_sec":[],"equipo":["mancuernas","banco"],"nivel":"principiante","tags_toji":["brazo_definido"],"coef":0.06,"img":"","instrucciones":["Apoya una rodilla y una mano en el banco, torso paralelo al suelo, mancuerna en la otra mano con el codo pegado al costado.","Extiende el brazo hacia atrás hasta que quede recto, apretando el tríceps.","Vuelve controlado a la posición inicial sin mover el codo."],"errores_comunes":["Balancear el cuerpo para generar impulso.","Bajar el codo del costado — pierde tensión en el tríceps."]},

  {"id":"dominadas","nombre":"Dominadas","en":"Pull-Up","grupo":"espalda","musculos_sec":["biceps","hombro"],"equipo":["barra_dominadas"],"nivel":"intermedio","tags_toji":["v_taper","prioridad"],"coef":0,"img":"Pullups/0.jpg","instrucciones":["Cuelga de la barra con agarre prono (palmas hacia adelante), algo más ancho que los hombros.","Tira de tu cuerpo hacia arriba llevando la barbilla por encima de la barra, apretando la espalda.","Baja controlado hasta extender los brazos del todo."],"errores_comunes":["Usar mucho balanceo — controla el movimiento, sobre todo en la bajada.","No bajar del todo entre repetición y repetición."]},
  {"id":"dominadas_negativas","nombre":"Dominadas negativas (excéntricas)","en":"Negative Pull-Up","grupo":"espalda","musculos_sec":["biceps","hombro"],"equipo":["barra_dominadas","banco"],"nivel":"principiante","tags_toji":["v_taper"],"coef":0,"img":"","instrucciones":["Sube a la posición alta de la dominada ayudándote con un banco o un salto.","Desde arriba, baja lo más lento que puedas (4-6 segundos) hasta extender los brazos.","Vuelve a subir con ayuda y repite. Es el paso previo antes de hacer la dominada completa."],"errores_comunes":["Dejarte caer rápido — el valor está en bajar lento.","Saltar demasiado alto en vez de controlar desde arriba."]},
  {"id":"dominadas_agarre_cerrado","nombre":"Dominadas supinas (agarre cerrado)","en":"Close-Grip Chin-Up","grupo":"espalda","musculos_sec":["biceps"],"equipo":["barra_dominadas"],"nivel":"intermedio","tags_toji":["v_taper","brazo_definido"],"coef":0,"img":"","instrucciones":["Cuelga de la barra con agarre supino (palmas hacia ti), manos juntas a la anchura de los hombros.","Tira hacia arriba llevando el pecho hacia la barra.","Baja controlado hasta extender los brazos del todo."],"errores_comunes":["Agarre demasiado estrecho puede molestar la muñeca — ajusta a lo que te resulte cómodo.","Mismo error que en dominadas: evitar el balanceo."]},
  {"id":"jalon_pecho_polea","nombre":"Jalón al pecho en polea","en":"Lat Pulldown","grupo":"espalda","musculos_sec":["biceps","hombro"],"equipo":["polea"],"nivel":"principiante","tags_toji":["v_taper","prioridad"],"coef":0.55,"img":"","instrucciones":["Siéntate sujetando las rodillas bajo el soporte, barra ancha por encima de la cabeza.","Tira hacia abajo llevando la barra hasta la parte alta del pecho, sacando pecho y apretando la espalda.","Sube controlado hasta extender los brazos del todo."],"errores_comunes":["Inclinarte demasiado hacia atrás para tirar con el peso del cuerpo.","Tirar la barra hasta el cuello en vez del pecho."]},
  {"id":"remo_una_mano","nombre":"Remo a una mano con mancuerna","en":"One-Arm Dumbbell Row","grupo":"espalda","musculos_sec":["biceps"],"equipo":["mancuernas","banco"],"nivel":"principiante","tags_toji":["v_taper"],"coef":0.35,"img":"Bent_Over_One-Arm_Long_Bar_Row/0.jpg","instrucciones":["Apoya una rodilla y una mano en el banco, espalda paralela al suelo, mancuerna en la mano libre colgando.","Tira de la mancuerna hacia la cadera, llevando el codo hacia atrás y apretando el omóplato.","Baja controlado hasta extender el brazo del todo."],"errores_comunes":["Rotar el torso para ayudarte — mantén los hombros paralelos al suelo.","Tirar con el brazo hacia el pecho en vez de hacia la cadera, pierde activación de dorsal."]},
  {"id":"remo_dos_manos","nombre":"Remo con mancuernas a dos manos","en":"Two-Arm Dumbbell Row","grupo":"espalda","musculos_sec":["biceps"],"equipo":["mancuernas"],"nivel":"principiante","tags_toji":["v_taper"],"coef":0.28,"img":"","instrucciones":["Inclina el torso hacia adelante unos 45°, rodillas ligeramente flexionadas, mancuernas colgando.","Tira de ambas mancuernas hacia la cadera, apretando los omóplatos arriba.","Baja controlado hasta extender los brazos."],"errores_comunes":["Redondear la espalda — mantén el pecho alto y la espalda recta.","Usar impulso de la cadera para levantar el peso."]},
  {"id":"remo_barra","nombre":"Remo con barra","en":"Barbell Row","grupo":"espalda","musculos_sec":["biceps"],"equipo":["barra"],"nivel":"intermedio","tags_toji":["v_taper","prioridad"],"coef":0.55,"img":"","instrucciones":["Inclina el torso unos 45°, barra colgando con agarre prono un poco más ancho que los hombros.","Tira de la barra hacia el abdomen, apretando los omóplatos arriba.","Baja controlado sin perder la posición de la espalda."],"errores_comunes":["Redondear la espalda baja — mantenla recta y fija todo el recorrido.","Usar demasiado impulso de cadera (remo 'de tirón')."]},
  {"id":"remo_polea_sentado","nombre":"Remo en polea sentado","en":"Seated Cable Row","grupo":"espalda","musculos_sec":["biceps"],"equipo":["polea"],"nivel":"principiante","tags_toji":["v_taper"],"coef":0.5,"img":"","instrucciones":["Siéntate con las rodillas ligeramente flexionadas, agarre en V o barra recta.","Tira hacia el abdomen manteniendo la espalda recta, apretando los omóplatos.","Vuelve controlado dejando que los brazos se extiendan sin redondear la espalda."],"errores_comunes":["Balancear el torso adelante y atrás en vez de mover solo los brazos."]},
  {"id":"remo_invertido_banco","nombre":"Remo invertido en banco","en":"Inverted Row","grupo":"espalda","musculos_sec":["biceps"],"equipo":["banco"],"nivel":"principiante","tags_toji":["v_taper"],"coef":0,"img":"","instrucciones":["Coloca el banco de forma estable, túmbate debajo agarrando el borde con ambas manos, cuerpo recto.","Tira de tu pecho hacia el borde del banco apretando la espalda.","Baja controlado hasta extender los brazos del todo."],"errores_comunes":["Dejar caer la cadera — mantén el cuerpo en línea recta como en una plancha.","Usar solo los brazos sin apretar la espalda."]},
  {"id":"pull_over","nombre":"Pull-over con mancuerna","en":"Dumbbell Pullover","grupo":"espalda","musculos_sec":["pecho"],"equipo":["mancuernas","banco"],"nivel":"intermedio","tags_toji":["v_taper"],"coef":0.20,"img":"","instrucciones":["Túmbate en el banco (solo la parte alta de la espalda apoyada si quieres más rango) con una mancuerna sujeta con ambas manos sobre el pecho.","Baja la mancuerna en arco por detrás de la cabeza, sintiendo el estiramiento en el dorsal.","Vuelve en el mismo arco hasta la posición inicial sobre el pecho."],"errores_comunes":["Flexionar mucho los codos — conviértelo casi en un press.","Bajar más de lo que tu hombro permite cómodamente."]},
  {"id":"peso_muerto_barra","nombre":"Peso muerto con barra","en":"Barbell Deadlift","grupo":"espalda","musculos_sec":["pierna","gluteo"],"equipo":["barra"],"nivel":"avanzado","tags_toji":["v_taper","pierna_funcional","prioridad"],"coef":0.95,"img":"","instrucciones":["Barra pegada a las espinillas, pies a la anchura de cadera, agarre justo fuera de las piernas.","Pecho arriba, espalda recta, empuja el suelo con los pies para levantar la barra pegada al cuerpo.","Termina de pie con cadera extendida, sin hiperextender la zona lumbar."],"errores_comunes":["Redondear la espalda baja — el fallo más peligroso de este ejercicio.","Alejar la barra del cuerpo durante la subida."]},
  {"id":"remo_t_maquina","nombre":"Remo en máquina T-bar","en":"T-Bar Row Machine","grupo":"espalda","musculos_sec":["biceps"],"equipo":["maquina"],"nivel":"intermedio","tags_toji":["v_taper"],"coef":0.5,"img":"","instrucciones":["Coloca el pecho apoyado en el respaldo inclinado, agarre en V bajo la barra.","Tira hacia el pecho apretando los omóplatos.","Baja controlado hasta extender los brazos."],"errores_comunes":["Levantar el pecho del respaldo para generar impulso."]},
  {"id":"superman","nombre":"Superman (zona lumbar)","en":"Superman","grupo":"espalda","musculos_sec":["core"],"equipo":["peso_corporal"],"nivel":"principiante","tags_toji":["postura"],"coef":0,"img":"","instrucciones":["Túmbate boca abajo con brazos extendidos al frente.","Eleva brazos y piernas a la vez unos centímetros del suelo, apretando la zona lumbar y glúteo.","Mantén 1-2 segundos arriba y baja controlado."],"errores_comunes":["Elevar demasiado generando tensión en el cuello — mira al suelo."]},

  {"id":"curl_biceps","nombre":"Curl de bíceps","en":"Dumbbell Bicep Curl","grupo":"biceps","musculos_sec":[],"equipo":["mancuernas"],"nivel":"principiante","tags_toji":["brazo_definido","prioridad"],"coef":0.14,"img":"Dumbbell_Bicep_Curl/0.jpg","instrucciones":["De pie, una mancuerna en cada mano, palmas hacia adelante, codos pegados al cuerpo.","Flexiona los codos llevando las mancuernas hacia los hombros.","Baja controlado hasta extender los brazos del todo."],"errores_comunes":["Balancear el cuerpo o usar impulso de hombro.","Mover los codos hacia adelante en vez de mantenerlos fijos al costado."]},
  {"id":"curl_barra","nombre":"Curl de bíceps con barra","en":"Barbell Curl","grupo":"biceps","musculos_sec":[],"equipo":["barra"],"nivel":"intermedio","tags_toji":["brazo_definido"],"coef":0.30,"img":"","instrucciones":["De pie, agarre supino a la anchura de los hombros, codos pegados al cuerpo.","Flexiona los codos subiendo la barra hasta los hombros.","Baja controlado sin balancear el torso."],"errores_comunes":["Usar impulso de cadera para subir la barra ('curl de trampa').","Abrir los codos hacia adelante durante la subida."]},
  {"id":"curl_polea","nombre":"Curl de bíceps en polea","en":"Cable Curl","grupo":"biceps","musculos_sec":[],"equipo":["polea"],"nivel":"principiante","tags_toji":["brazo_definido"],"coef":0.22,"img":"","instrucciones":["De pie frente a la polea baja, agarre de barra recta, codos pegados al cuerpo.","Flexiona los codos llevando la barra hacia los hombros, con tensión constante.","Baja controlado sin extender del todo para no perder tensión."],"errores_comunes":["Alejarte demasiado de la polea, cambiando el ángulo de tracción."]},
  {"id":"curl_martillo","nombre":"Curl martillo","en":"Hammer Curl","grupo":"biceps","musculos_sec":["antebrazo"],"equipo":["mancuernas"],"nivel":"principiante","tags_toji":["brazo_definido"],"coef":0.14,"img":"","instrucciones":["De pie, mancuernas con agarre neutro (palmas mirándose entre sí), codos pegados al cuerpo.","Flexiona los codos llevando las mancuernas hacia los hombros sin girar la muñeca.","Baja controlado."],"errores_comunes":["Girar la muñeca hacia el curl normal — el agarre se mantiene neutro todo el recorrido."]},
  {"id":"curl_concentrado","nombre":"Curl concentrado","en":"Concentration Curl","grupo":"biceps","musculos_sec":[],"equipo":["mancuernas","banco"],"nivel":"intermedio","tags_toji":["brazo_definido"],"coef":0.12,"img":"","instrucciones":["Siéntate en el banco, codo apoyado en la cara interna del muslo, mancuerna colgando.","Flexiona el codo llevando la mancuerna hacia el hombro, aislando el bíceps.","Baja controlado hasta extender el brazo del todo."],"errores_comunes":["Despegar el codo del muslo durante el movimiento."]},
  {"id":"curl_banco_scott","nombre":"Curl en banco Scott (predicador)","en":"Preacher Curl Machine","grupo":"biceps","musculos_sec":[],"equipo":["maquina"],"nivel":"intermedio","tags_toji":["brazo_definido"],"coef":0.20,"img":"","instrucciones":["Apoya los brazos sobre el respaldo inclinado, axilas pegadas al borde.","Flexiona los codos llevando el peso hacia los hombros.","Baja controlado sin extender el codo del todo bruscamente."],"errores_comunes":["Despegar los brazos del respaldo para hacer trampa."]},

  {"id":"sentadilla_goblet","nombre":"Sentadilla goblet con mancuerna","en":"Goblet Squat","grupo":"pierna","musculos_sec":["gluteo","core"],"equipo":["mancuernas"],"nivel":"principiante","tags_toji":["pierna_funcional"],"coef":0.30,"img":"Goblet_Squat/0.jpg","instrucciones":["Sujeta una mancuerna verticalmente pegada al pecho con ambas manos.","Baja en sentadilla manteniendo el pecho alto y las rodillas siguiendo la dirección de los pies.","Baja hasta donde tu movilidad lo permita cómodamente y sube empujando por los talones."],"errores_comunes":["Dejar que las rodillas colapsen hacia adentro.","Levantar los talones del suelo — reduce la profundidad si pasa."]},
  {"id":"sentadilla_barra","nombre":"Sentadilla trasera con barra","en":"Barbell Back Squat","grupo":"pierna","musculos_sec":["gluteo","core"],"equipo":["barra"],"nivel":"avanzado","tags_toji":["pierna_funcional","prioridad"],"coef":0.85,"img":"","instrucciones":["Barra apoyada sobre los trapecios, pies a la anchura de hombros, pecho alto.","Baja doblando cadera y rodillas a la vez hasta que los muslos pasen de paralelo si tu movilidad lo permite.","Sube empujando el suelo con fuerza hasta extender las piernas."],"errores_comunes":["Dejar que las rodillas colapsen hacia adentro.","Redondear la espalda baja al fondo del recorrido — reduce el rango si pasa."]},
  {"id":"prensa_piernas","nombre":"Prensa de piernas","en":"Leg Press","grupo":"pierna","musculos_sec":["gluteo"],"equipo":["maquina"],"nivel":"principiante","tags_toji":["pierna_funcional"],"coef":1.3,"img":"","instrucciones":["Siéntate con la espalda pegada al respaldo, pies a la anchura de hombros sobre la plataforma.","Baja controlado hasta que las rodillas formen unos 90°.","Empuja la plataforma hasta casi extender las piernas, sin bloquear la rodilla con fuerza."],"errores_comunes":["Despegar la zona lumbar del respaldo al bajar demasiado.","Bloquear la rodilla con fuerza arriba."]},
  {"id":"extension_cuadriceps_maquina","nombre":"Extensión de cuádriceps en máquina","en":"Leg Extension","grupo":"pierna","musculos_sec":[],"equipo":["maquina"],"nivel":"principiante","tags_toji":["pierna_funcional"],"coef":0.45,"img":"","instrucciones":["Siéntate con el respaldo ajustado, el rodillo apoyado justo encima del tobillo.","Extiende las piernas hasta casi bloquear la rodilla, apretando el cuádriceps.","Baja controlado sin soltar el peso de golpe."],"errores_comunes":["Usar impulso subiendo de golpe en vez de controlado."]},
  {"id":"curl_femoral_maquina","nombre":"Curl femoral en máquina","en":"Leg Curl","grupo":"pierna","musculos_sec":["gluteo"],"equipo":["maquina"],"nivel":"principiante","tags_toji":["pierna_funcional"],"coef":0.40,"img":"","instrucciones":["Túmbate boca abajo (o sentado según la máquina), rodillo justo encima del talón.","Flexiona las rodillas llevando el rodillo hacia los glúteos.","Baja controlado hasta extender las piernas del todo."],"errores_comunes":["Elevar la cadera del banco para ayudarte con el impulso."]},
  {"id":"zancada_bulgara","nombre":"Zancada búlgara","en":"Bulgarian Split Squat","grupo":"pierna","musculos_sec":["gluteo"],"equipo":["mancuernas","banco"],"nivel":"intermedio","tags_toji":["pierna_funcional"],"coef":0.20,"img":"","instrucciones":["Apoya el empeine de un pie en el banco detrás de ti, el otro pie un paso adelante.","Baja flexionando la rodilla delantera hasta un ángulo cómodo, torso ligeramente inclinado adelante.","Sube empujando por el talón delantero."],"errores_comunes":["Dar un paso demasiado corto adelante — sobrecarga la rodilla.","Bajar demasiado rápido sin control."]},
  {"id":"step_up","nombre":"Step-up (subida al cajón)","en":"Step-Up","grupo":"pierna","musculos_sec":["gluteo"],"equipo":["banco"],"nivel":"principiante","tags_toji":["pierna_funcional"],"coef":0.14,"img":"","instrucciones":["De pie frente al banco (o step), coloca un pie entero encima.","Empuja con ese pie para subir todo el cuerpo, sin impulsarte con el pie de atrás.","Baja controlado y repite, alternando piernas."],"errores_comunes":["Empujar con la pierna de abajo en vez de la de arriba — pierde el objetivo del ejercicio."]},
  {"id":"zancada_caminando","nombre":"Zancadas caminando","en":"Walking Lunge","grupo":"pierna","musculos_sec":["gluteo"],"equipo":["peso_corporal","mancuernas"],"nivel":"principiante","tags_toji":["pierna_funcional"],"coef":0.10,"img":"","instrucciones":["Da un paso largo adelante y baja hasta que ambas rodillas formen unos 90°.","Empuja con la pierna delantera para llevar la pierna trasera adelante, en un movimiento continuo.","Repite alternando piernas, con o sin mancuernas en las manos."],"errores_comunes":["Pasos demasiado cortos — reduce el rango y carga más la rodilla."]},
  {"id":"peso_muerto_rumano","nombre":"Peso muerto rumano con mancuernas","en":"Romanian Deadlift","grupo":"pierna","musculos_sec":["gluteo","espalda"],"equipo":["mancuernas"],"nivel":"intermedio","tags_toji":["pierna_funcional"],"coef":0.45,"img":"","instrucciones":["De pie, mancuernas frente a los muslos, rodillas con ligera flexión fija durante todo el movimiento.","Inclina el torso hacia adelante empujando la cadera hacia atrás, mancuernas pegadas a las piernas.","Baja hasta sentir el estiramiento en isquiotibiales (más o menos a media espinilla) y vuelve apretando el glúteo."],"errores_comunes":["Redondear la espalda — mantenla recta todo el recorrido.","Flexionar demasiado la rodilla y convertirlo en sentadilla."]},
  {"id":"peso_muerto_rumano_barra","nombre":"Peso muerto rumano con barra","en":"Barbell Romanian Deadlift","grupo":"pierna","musculos_sec":["gluteo","espalda"],"equipo":["barra"],"nivel":"intermedio","tags_toji":["pierna_funcional","prioridad"],"coef":0.65,"img":"","instrucciones":["De pie, barra pegada a los muslos, rodillas con ligera flexión fija.","Inclina el torso empujando la cadera hacia atrás, barra pegada a las piernas todo el recorrido.","Baja hasta sentir el estiramiento en isquiotibiales y vuelve apretando el glúteo."],"errores_comunes":["Alejar la barra del cuerpo — debe rozar las piernas todo el trayecto.","Redondear la espalda baja."]},
  {"id":"hip_thrust","nombre":"Hip thrust con banco","en":"Hip Thrust","grupo":"pierna","musculos_sec":["core"],"equipo":["banco","mancuernas"],"nivel":"intermedio","tags_toji":["pierna_funcional"],"coef":0.40,"img":"","instrucciones":["Apoya la parte alta de la espalda en el banco, pies firmes en el suelo, mancuerna sobre la cadera si quieres más carga.","Empuja la cadera hacia arriba apretando el glúteo hasta que el torso quede paralelo al suelo.","Baja controlado sin llegar a sentarte del todo."],"errores_comunes":["Arquear la zona lumbar en vez de empujar con el glúteo.","Apoyar mal el banco — asegúrate de que no se mueva."]},
  {"id":"hip_thrust_barra","nombre":"Hip thrust con barra","en":"Barbell Hip Thrust","grupo":"pierna","musculos_sec":["core"],"equipo":["barra","banco"],"nivel":"intermedio","tags_toji":["pierna_funcional"],"coef":0.70,"img":"","instrucciones":["Apoya la parte alta de la espalda en el banco, barra sobre la cadera (usa una toalla o almohadilla).","Empuja la cadera hacia arriba apretando el glúteo hasta que el torso quede paralelo al suelo.","Baja controlado sin llegar a sentarte del todo."],"errores_comunes":["Arquear la zona lumbar en vez de empujar con el glúteo."]},
  {"id":"puente_gluteo","nombre":"Puente de glúteo","en":"Glute Bridge","grupo":"pierna","musculos_sec":["core"],"equipo":["peso_corporal"],"nivel":"principiante","tags_toji":["pierna_funcional"],"coef":0,"img":"","instrucciones":["Túmbate boca arriba, rodillas flexionadas, pies apoyados cerca de los glúteos.","Empuja la cadera hacia arriba apretando el glúteo hasta formar una línea recta de hombros a rodillas.","Baja controlado sin tocar del todo el suelo entre repeticiones."],"errores_comunes":["Arquear la espalda en vez de usar el glúteo."]},
  {"id":"elevacion_gemelo","nombre":"Elevación de gemelo de pie","en":"Standing Calf Raise","grupo":"pierna","musculos_sec":[],"equipo":["peso_corporal","mancuernas"],"nivel":"principiante","tags_toji":["pierna_funcional"],"coef":0.10,"img":"","instrucciones":["De pie, sube sobre las puntas de los pies lo máximo posible, apretando la pantorrilla.","Mantén 1 segundo arriba.","Baja controlado hasta sentir el estiramiento."],"errores_comunes":["Hacerlo demasiado rápido, perdiendo la contracción arriba."]},
  {"id":"gemelo_maquina","nombre":"Elevación de gemelo en máquina","en":"Calf Raise Machine","grupo":"pierna","musculos_sec":[],"equipo":["maquina"],"nivel":"principiante","tags_toji":["pierna_funcional"],"coef":0.60,"img":"","instrucciones":["Coloca los hombros bajo las almohadillas, punta de los pies sobre el borde de la plataforma.","Sube sobre las puntas de los pies al máximo, aprieta arriba 1 segundo.","Baja controlado hasta sentir el estiramiento completo."],"errores_comunes":["Hacer el recorrido demasiado corto y rápido — controla ambas fases."]},
  {"id":"sentadilla_sumo","nombre":"Sentadilla sumo con mancuerna","en":"Dumbbell Sumo Squat","grupo":"pierna","musculos_sec":["gluteo"],"equipo":["mancuernas"],"nivel":"principiante","tags_toji":["pierna_funcional"],"coef":0.30,"img":"","instrucciones":["Pies bastante más separados que los hombros, puntas ligeramente hacia afuera, mancuerna colgando con ambas manos.","Baja doblando cadera y rodillas, manteniendo el torso erguido.","Sube empujando por los talones, apretando el glúteo arriba."],"errores_comunes":["Inclinar demasiado el torso hacia adelante."]},

  {"id":"plancha","nombre":"Plancha","en":"Plank","grupo":"core","musculos_sec":[],"equipo":["peso_corporal"],"nivel":"principiante","tags_toji":["abdomen_visible"],"coef":0,"modo":"tiempo","img":"Plank/0.jpg","instrucciones":["Apóyate en antebrazos y puntas de los pies, cuerpo en línea recta de cabeza a talones.","Aprieta el abdomen y el glúteo, sin dejar caer ni levantar la cadera.","Mantén la posición respirando con normalidad."],"errores_comunes":["Dejar caer la cadera — es el error más común, corta la serie antes que perder la forma."]},
  {"id":"plancha_lateral","nombre":"Plancha lateral","en":"Side Plank","grupo":"core","musculos_sec":[],"equipo":["peso_corporal"],"nivel":"principiante","tags_toji":["abdomen_visible"],"coef":0,"modo":"tiempo","img":"","instrucciones":["Apóyate en un antebrazo, cuerpo de lado en línea recta, pies apilados.","Eleva la cadera del suelo, formando una línea recta de cabeza a pies.","Mantén la posición y repite en el otro lado."],"errores_comunes":["Dejar caer la cadera hacia el suelo."]},
  {"id":"elevacion_piernas_colgado","nombre":"Elevación de piernas colgado","en":"Hanging Leg Raise","grupo":"core","musculos_sec":["antebrazo"],"equipo":["barra_dominadas"],"nivel":"intermedio","tags_toji":["abdomen_visible"],"coef":0,"img":"","instrucciones":["Cuelga de la barra con los brazos extendidos.","Eleva las piernas (rectas o flexionadas) hasta que los muslos queden al menos paralelos al suelo.","Baja controlado sin balancearte."],"errores_comunes":["Usar balanceo del cuerpo en vez de fuerza abdominal."]},
  {"id":"elevacion_piernas_suelo","nombre":"Elevación de piernas tumbado","en":"Lying Leg Raise","grupo":"core","musculos_sec":[],"equipo":["peso_corporal"],"nivel":"principiante","tags_toji":["abdomen_visible"],"coef":0,"img":"","instrucciones":["Túmbate boca arriba, manos bajo la zona lumbar o a los lados, piernas extendidas.","Eleva las piernas juntas hasta formar 90° con el suelo, sin doblar las rodillas.","Baja controlado sin dejar que la zona lumbar se despegue del suelo."],"errores_comunes":["Dejar que la espalda baja se arquee al bajar las piernas — para el recorrido antes si pasa."]},
  {"id":"crunch_bicicleta","nombre":"Crunch bicicleta","en":"Bicycle Crunch","grupo":"core","musculos_sec":[],"equipo":["peso_corporal"],"nivel":"principiante","tags_toji":["abdomen_visible"],"coef":0,"img":"","instrucciones":["Túmbate boca arriba, manos detrás de la cabeza, piernas elevadas con rodillas flexionadas.","Lleva el codo hacia la rodilla contraria mientras extiendes la otra pierna, en un movimiento de pedaleo.","Alterna de forma controlada, sin tirar del cuello con las manos."],"errores_comunes":["Tirar del cuello con las manos en vez de rotar con el abdomen."]},
  {"id":"crunch_polea","nombre":"Crunch en polea (de rodillas)","en":"Cable Kneeling Crunch","grupo":"core","musculos_sec":[],"equipo":["polea"],"nivel":"intermedio","tags_toji":["abdomen_visible"],"coef":0.25,"img":"","instrucciones":["De rodillas frente a la polea alta con cuerda, sujeta la cuerda a los lados de la cabeza.","Flexiona el torso hacia abajo llevando los codos hacia las rodillas, redondeando la espalda.","Vuelve controlado sin soltar la tensión abdominal."],"errores_comunes":["Tirar con los brazos en vez de flexionar el torso con el abdomen."]},
  {"id":"rueda_abdominal","nombre":"Rueda abdominal","en":"Ab Wheel Rollout","grupo":"core","musculos_sec":["hombro"],"equipo":["peso_corporal"],"nivel":"avanzado","tags_toji":["abdomen_visible"],"coef":0,"img":"","instrucciones":["De rodillas, sujeta la rueda con ambas manos, apoyada en el suelo frente a ti.","Rueda hacia adelante extendiendo el cuerpo lo máximo que controles, sin que la cadera se hunda.","Vuelve tirando con el abdomen hasta la posición inicial."],"errores_comunes":["Dejar caer la zona lumbar — reduce el recorrido si pasa.","Empujar solo con los brazos en vez de con el abdomen."]},

  {"id":"cinta_caminata_inclinada","nombre":"Caminata inclinada en cinta","en":"Incline Treadmill Walk","grupo":"cardio","musculos_sec":["pierna"],"equipo":["cinta"],"nivel":"principiante","tags_toji":["abdomen_visible","bajo_impacto"],"coef":0,"modo":"tiempo","img":"","instrucciones":["Ajusta la inclinación entre 6-10% y un ritmo al que puedas hablar pero no cantar.","Mantén la postura erguida, sin agarrarte a las barras para apoyarte.","Sostén el ritmo durante 30-40 minutos."],"errores_comunes":["Agarrarte a las barras — reduce el gasto calórico real y la postura."]},
  {"id":"cinta_intervalos","nombre":"Intervalos en cinta","en":"Treadmill Intervals","grupo":"cardio","musculos_sec":["pierna"],"equipo":["cinta"],"nivel":"intermedio","tags_toji":["abdomen_visible"],"coef":0,"modo":"tiempo","img":"","instrucciones":["Alterna 1 minuto a ritmo fuerte (o inclinación alta) con 1 minuto suave para recuperar.","Repite 8-10 rondas.","Termina siempre con 3-5 minutos de ritmo suave para bajar pulsaciones."],"errores_comunes":["Empezar demasiado fuerte y no aguantar los últimos intervalos — reparte el esfuerzo."]},
  {"id":"bici_estatica","nombre":"Bicicleta estática","en":"Stationary Bike","grupo":"cardio","musculos_sec":["pierna"],"equipo":["bici"],"nivel":"principiante","tags_toji":["abdomen_visible","bajo_impacto"],"coef":0,"modo":"tiempo","img":"","instrucciones":["Ajusta el sillín a la altura de la cadera con la pierna casi extendida abajo.","Pedalea a un ritmo constante que puedas sostener 20-30 minutos.","Sube la resistencia progresivamente cada semana."],"errores_comunes":["Sillín demasiado bajo — sobrecarga la rodilla."]}
]
