<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Plan Toji</title>
<meta name="theme-color" content="#131210">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <img class="gate-mark" src="icons/hero-silhouette.svg" alt="" aria-hidden="true">
    <p class="eyebrow">Sorcerer Killer</p>
    <h1 id="gate-title">Plan Toji</h1>

    <div class="gate-tabs" id="gate-tabs">
      <button data-mode="login" class="active">Entrar</button>
      <button data-mode="signup">Crear cuenta</button>
    </div>

    <input type="email" id="gate-email" autocomplete="email" placeholder="Email" inputmode="email">
    <input type="password" id="gate-password" autocomplete="current-password" placeholder="Contraseña">

    <p class="gate-err" id="gate-err"></p>
    <p class="gate-ok" id="gate-ok"></p>

    <button id="gate-btn" class="btn primary">Entrar</button>
    <button id="gate-forgot" class="gate-forgot">¿Has olvidado tu contraseña?</button>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <div class="brand">Plan Toji</div>
    <div class="row" style="gap:8px;">
      <div class="streak-pill" id="streak-pill">
        <img class="flame" src="icons/flame.svg" alt="">
        <span class="n" id="streak-n">0</span>
      </div>
      <button class="icon-btn" id="btn-settings" aria-label="Ajustes">⚙️</button>
    </div>
  </header>

  <main id="main">
    <section class="view" id="view-rutina"></section>
    <section class="view" id="view-entrenar"></section>
    <section class="view" id="view-comer"></section>
    <section class="view" id="view-guias"></section>
    <section class="view" id="view-yo"></section>
  </main>

  <nav class="bottom" id="bottom-nav">
    <button data-view="rutina" class="active"><span class="ic">🗓️</span>Rutina</button>
    <button data-view="entrenar"><span class="ic">🏋️</span>Entrenar</button>
    <button data-view="comer"><span class="ic">🍽️</span>Comer</button>
    <button data-view="guias"><span class="ic">📖</span>Guías</button>
    <button data-view="yo"><span class="ic">📈</span>Yo</button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js?v=3"></script>
<script src="js/store.js?v=3"></script>
<script src="js/engine.js?v=3"></script>
<script src="js/auth.js?v=3"></script>
<script src="js/view-rutina.js?v=3"></script>
<script src="js/view-entrenar.js?v=3"></script>
<script src="js/view-comer.js?v=3"></script>
<script src="js/view-guias.js?v=3"></script>
<script src="js/view-yo.js?v=3"></script>
<script src="js/main.js?v=3"></script>
</body>
</html>
